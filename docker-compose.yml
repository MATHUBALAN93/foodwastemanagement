services:

  backend:
    build:
      context: ./server
    container_name: foodshare-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env

  frontend:
    build:
      context: .
    container_name: foodshare-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend